name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos & SDKs
        uses: dpogo/theos-action@main
        with:
          theos: true
          sdks: true

      - name: Build Tweak
        run: |
          export THEOS=~/theos
          make clean
          make
          ls -la obj/

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: R6MobileMod.dylib
          path: obj/*.dylib
