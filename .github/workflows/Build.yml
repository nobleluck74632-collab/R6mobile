name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /opt/theos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid
          mkdir -p /opt/theos

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: Build Tweak
        run: |
          make package FINAL=1 THEOS=/opt/theos

      - name: Find output files
        run: |
          find . -name "*.dylib" -o -name "*.deb" | head -20

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: R6MobileMod
          path: |
            packages/*.dylib
            packages/*.deb
            obj/*.dylib
