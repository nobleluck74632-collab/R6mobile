name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /opt/theos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid
          mkdir -p /opt/theos

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: Build Dylib Only
        run: |
          export THEOS=/opt/theos
          make clean
          make
          ls -la obj/

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: R6MobileMod.dylib
          path: obj/*.dylib
